name: Build GrowAI preview site

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Hosted site repository (owner/repo)'
        required: true
      commit_sha:
        description: 'Exact preview commit SHA'
        required: true
      site_name:
        description: 'GrowAI site name'
        required: true
      check_url:
        description: 'Preview deploy check URL'
        required: true
      callback_url:
        description: 'Preview deploy callback URL'
        required: true

permissions:
  contents: read

concurrency:
  group: growai-preview-${{ inputs.site_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy_preview:
    runs-on: ubuntu-latest
    steps:
    - name: Validate inputs
      env:
        REPOSITORY: ${{ inputs.repository }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
        SITE_NAME: ${{ inputs.site_name }}
        HOSTED_ORG: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        [[ -n "$HOSTED_ORG" ]]
        [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
        [[ "${REPOSITORY%%/*}" == "$HOSTED_ORG" ]]
        [[ "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
        [[ "$SITE_NAME" =~ ^[A-Za-z0-9-]+$ ]]
        [[ "/preview-$SITE_NAME" != "/" ]]

    - name: Checkout deployment tools
      uses: actions/checkout@v4
      with:
        path: _central
        fetch-depth: 1
        sparse-checkout: |
          scripts/refresh_cdn.py
          scripts/subdirectory_summary.py
        sparse-checkout-cone-mode: false

    - name: Checkout preview commit
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.commit_sha }}
        fetch-depth: 1
        submodules: 'true'
        path: _site

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '10'

    - name: Restore GitBook CLI
      uses: actions/cache@v4
      with:
        path: .gitbook-cli
        key: growai-gitbook-cli-${{ runner.os }}-node10-2.3.2

    - name: Restore GitBook dependencies
      id: gitbook-dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gitbook
          _site/node_modules
        key: growai-gitbook-${{ runner.os }}-${{ hashFiles('_site/book.json') }}

    - name: Prepare GitBook CLI
      run: |
        echo "${{ github.workspace }}/.gitbook-cli/node_modules/.bin" >> "$GITHUB_PATH"
        if [[ ! -x .gitbook-cli/node_modules/.bin/gitbook ]]; then
          npm install --prefix .gitbook-cli gitbook-cli@2.3.2 --no-audit --no-fund
        fi

    - name: Install GitBook dependencies
      if: steps.gitbook-dependencies.outputs.cache-hit != 'true'
      run: gitbook install
      working-directory: _site

    - name: Build GitBook
      run: |
        mkdir -p ../cache
        gitbook build
      working-directory: _site

    - name: Format output
      run: |
        legacy_command='docker run -t -w /gitbook -v `pwd`:/gitbook erlang:21  escript scripts/subdirectory_summary.escript'
        if grep -Fq "$legacy_command" Makefile; then
          perl -0pi -e 's{\Qdocker run -t -w /gitbook -v `pwd`:/gitbook erlang:21  escript scripts/subdirectory_summary.escript\E}{python3 ../_central/scripts/subdirectory_summary.py --site-dir .}' Makefile
        fi
        make refine
      working-directory: _site

    - name: Prevent preview indexing
      run: |
        find _book -type f -name '*.html' -exec sed -i 's#</head>#<meta name="robots" content="noindex,nofollow,noarchive"></head>#' {} +
        printf 'User-agent: *\nDisallow: /\n' > _book/robots.txt
      working-directory: _site

    - name: Restore current Node.js for deployment actions
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Check preview deploy
      env:
        CHECK_URL: ${{ inputs.check_url }}
      run: |
        set -euo pipefail
        release_size=$(du -sb _site/_book/ | awk '{print $1}')
        response=$(curl --fail-with-body -X POST "$CHECK_URL" \
          -H "Content-Type: application/json" \
          -d "{\"release_size\": $release_size}")
        echo "Response: $response"
        echo "$response" | grep -q '"success"[[:space:]]*:[[:space:]]*true'

    - name: Upload preview site
      uses: maxim-top/upload-to-oss@1.0.1
      with:
        access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        bucket: grow-ai-sites
        endpoint: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        local-path: _site/_book
        remote-path: /preview-${{ inputs.site_name }}
        delay-html-file-upload: true
        no-delete-remote-files: false
        retry: 10
        concurrency: 50
        incremental: false

    - name: Refresh preview CDN
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      run: python3 _central/scripts/refresh_cdn.py --type Directory --path "https://preview-${{ inputs.site_name }}.site.chatai101.com/"

    - name: Send success callback
      if: success()
      env:
        CALLBACK_URL: ${{ inputs.callback_url }}
      run: |
        curl --fail-with-body -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -d '{"status":"ok"}'

    - name: Send failure callback
      if: failure() || cancelled()
      env:
        CALLBACK_URL: ${{ inputs.callback_url }}
      run: |
        curl --fail-with-body -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -d '{"status":"error"}'
