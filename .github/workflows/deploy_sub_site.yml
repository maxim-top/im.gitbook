name: Deploy sub site to CDN

on:
  workflow_dispatch:
    inputs:
      book_url:
        description: 'book url'
        required: true
      oss_path:
        description: 'oss path'
        required: true
      cdn_url:
        description: 'cdn url'
        required: true
      check_url:
        description: 'check url'
        required: true
      callback_url:
        description: 'callback url'
        required: true

jobs:
  deploy_sub_site:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout deployment tools
      uses: actions/checkout@v4
      with:
        path: _central
        fetch-depth: 1
        sparse-checkout: |
          scripts/refresh_cdn.py
        sparse-checkout-cone-mode: false

    - name: Download book
      run: |
        wget ${{ github.event.inputs.book_url }}
        tar xzvf book.tar.gz
    
    - name: Check deploy
      run: |
        ReleaseSize=`du -sb _book/ |awk '{print $1}'`
        response=$(curl -X POST ${{ github.event.inputs.check_url }} \
        -H "Content-Type: application/json" \
        -d "{\"release_size\": $ReleaseSize}")
        echo "Response: $response"
        if echo "$response" | grep -q "success"; then
          echo "Check deploy success"
        else
          echo "Check deploy failed"
          exit 1
        fi

    - name: Upload to OSS
      uses: maxim-top/upload-to-oss@1.0.2
      with:
        # Use Access Key
        access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        bucket: grow-ai-sites
        endpoint: ${{ secrets.ALIYUN_OSS_ENDPOINT }}

        # Upload the built website files in "dist" directory to remote "my-website/" prefix
        local-path: _book
        remote-path: ${{ github.event.inputs.oss_path }}

        # Upload ALL other files before uploading HTML files
        delay-html-file-upload: true

        # Prevent deleting missing remote files compared to local (defaults to `false`)
        no-delete-remote-files: true

        # Retry 10 times on failure of each OSS operation
        retry: 10

        concurrency: 50

        # Use increment or not
        incremental: true

    - name: CDN Refresh
      env:
        ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
        ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        CDN_URL: ${{ github.event.inputs.cdn_url }}
      run: python3 _central/scripts/refresh_cdn.py --type Directory --path "$CDN_URL"

    # 发送成功回调
    - name: Send success callback
      id: report_success
      if: success()
      env:
        CALLBACK_URL: ${{ inputs.callback_url }}
      run: |
        receipt="$RUNNER_TEMP/deploy-finish.json"
        status=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
          --output "$receipt" --write-out '%{http_code}' \
          -H 'Content-Type: application/json' --data '{"status":"ok"}' "$CALLBACK_URL")
        if [[ "$status" != 2?? ]] || ! jq -se 'length == 1 and (.[0] | .code == 200 and .data.success == true)' "$receipt" >/dev/null; then
          echo "::error::Deployment finished, but Connector did not acknowledge success (HTTP $status)."
          exit 1
        fi

    # A missing acknowledgement must not overwrite a successful deployment.
    - name: Send failure callback
      if: failure() && steps.report_success.outcome == 'skipped'
      env:
        CALLBACK_URL: ${{ inputs.callback_url }}
      run: |
        curl -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -d '{"status":"error"}'
